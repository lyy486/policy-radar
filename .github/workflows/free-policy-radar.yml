name: 免费政策雷达更新与发布

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: free-policy-radar
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: 重建项目目录
        run: |
          mkdir -p src scripts test free-site/data data
          cp free-site-lib.js scripts/free-site-lib.js
          cp free-update.js scripts/free-update.js
          cp free-preview.js scripts/free-preview.js
          cp send-test-email.js scripts/send-test-email.js
          cp policy-service.js src/policy-service.js
          cp source-registry.js src/source-registry.js
          cp store.js src/store.js
          cp sync-service.js src/sync-service.js
          cp free-site.test.js test/free-site.test.js
          cp app.js icon.svg index.html manifest.webmanifest privacy.html styles.css sw.js free-site/
          cp policies.json free-site/data/policies.json
          cp free-store.json data/free-store.json
          cp free-notified.json data/free-notified.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 同步官方来源并生成静态网页数据
        run: npm run free:update
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - run: npm test
      - name: 保存最新公开数据和提醒去重状态
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f free-store.json free-notified.json policies.json
          git diff --cached --quiet || git commit -m "chore: refresh free policy data"
          git push
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: free-site
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
